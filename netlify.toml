[build]
  command = "npm run build"
  publish = "dist"

# Each page is now a real file in dist/ (e.g. dist/services/index.html),
# so Netlify serves it directly. Unknown URLs get dist/404.html with a real 404 status.

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[headers]]
  for = "/website-preview.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/preview.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
